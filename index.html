<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00ff88; /* Helles Robo-Grün */
            --screen-bg: #000000;
            --eye-color: var(--accent-color);
        }

        .child-mode {
            --bg-color: #f0faff;
            --card-bg: #ffffff;
            --text-color: #004d40;
            --accent-color: #ff4081; /* Pink für Kinder */
            --screen-bg: #0a0a0a;
            --eye-color: #ff80ab;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.5s ease;
            -webkit-user-select: none; user-select: none;
        }

        .container { max-width: 480px; width: 100%; }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.2s ease, background-color 0.5s ease;
        }

        /* --- JEFFS ANIME DISPLAY (SVG) --- */
        .robot-display {
            background-color: var(--screen-bg);
            border: 6px solid #333;
            border-radius: 30px;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 25px rgba(0,255,136,0.1);
            overflow: hidden;
            margin-bottom: 15px;
            transition: border-color 0.5s ease;
        }

        #jeff-face-svg {
            width: 90%;
            height: 90%;
        }

        /* Anime Augen Style */
        .eye-ball { fill: #fff; }
        .eye-pupil { fill: var(--eye-color); transition: fill 0.5s ease; }
        .eye-sparkle { fill: #fff; opacity: 0.8; }
        
        /* Blinzel-Animation */
        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        .eye-group {
            transform-origin: center;
            animation: blink 5s infinite;
        }

        /* Mund-Lippenwelle (wird per JS animiert) */
        #mouth-path {
            stroke: var(--eye-color);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
            transition: stroke 0.5s ease;
        }

        /* --- STEUERUNG & BUTTONS --- */
        .status-text { color: #888; font-size: 0.9em; margin-top: 10px; font-weight: 300; }
        .btn-group { display: flex; gap: 15px; margin-top: 15px; }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            background-color: #333;
            color: #ccc;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #222;
        }

        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #222; }

        .active-mode {
            background-color: var(--accent-color) !important;
            color: white !important;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .install-btn {
            background-color: #ff9800;
            color: white;
            width: 100%;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <button id="installBtn" class="install-btn" style="display:none;">📲 Jeff-App installieren</button>

    <!-- Simuliertes Anime-Display -->
    <div class="card">
        <div class="robot-display">
            <!-- SVG FACE START -->
            <svg id="jeff-face-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                
                <!-- Linkes Auge -->
                <g class="eye-group" id="eye-left" transform="translate(120, 100)">
                    <ellipse class="eye-ball" cx="0" cy="0" rx="35" ry="45"/>
                    <circle class="eye-pupil" id="pupil-left" cx="0" cy="5" rx="20" ry="25"/>
                    <circle class="eye-sparkle" cx="-12" cy="-15" r="8"/>
                    <circle class="eye-sparkle" cx="10" cy="15" r="4"/>
                </g>

                <!-- Rechtes Auge -->
                <g class="eye-group" id="eye-right" transform="translate(280, 100)">
                    <ellipse class="eye-ball" cx="0" cy="0" rx="35" ry="45"/>
                    <circle class="eye-pupil" id="pupil-right" cx="0" cy="5" rx="20" ry="25"/>
                    <circle class="eye-sparkle" cx="-12" cy="-15" r="8"/>
                    <circle class="eye-sparkle" cx="10" cy="15" r="4"/>
                </g>

                <!-- Animierter Mund (Mund-Welle) -->
                <!-- Start-Pfad: Eine leichte, ruhende Kurve -->
                <path id="mouth-path" d="M 150 210 Q 200 220 250 210" />
            
            </svg>
            <!-- SVG FACE END -->
        </div>
        <div class="status-text" id="statusLabel">Jeff Zustand: Bereit</div>
    </div>

    <!-- Steuerung -->
    <div class="card">
        <h3>Betriebsmodus</h3>
        <div class="btn-group">
            <button id="adultBtn" class="active-mode" onclick="setMode('adult')">👨 Erwachsener</button>
            <button id="childBtn" onclick="setMode('child')">🎈 Kindermodus</button>
        </div>
    </div>
</div>

<script>
    // --- PWA & Service Worker ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
    installBtn.addEventListener('click', () => { installBtn.style.display = 'none'; if (deferredPrompt) { deferredPrompt.prompt(); } });

    // --- SVG MUND ANIMATION (Lippenwelle) ---
    const mouthPath = document.getElementById('mouth-path');
    let speechAnimationInterval;

    // Diese Funktion lässt den Mund "reden", indem die SVG-Kurve wellenartig verändert wird
    function animateMouthSpeaking() {
        if (speechAnimationInterval) clearInterval(speechAnimationInterval);
        
        // Startet die Wellenbewegung
        speechAnimationInterval = setInterval(() => {
            // Zufällige Werte für die Welle erzeugen (dynamisch & smooth)
            const bend = 220 + (Math.random() * 25 - 12); // Vertikale Krümmung
            const wobble = 200 + (Math.random() * 15 - 7);  // Horizontale Verschiebung
            
            // Den neuen SVG-Pfad setzen (Q = quadratische Bezierkurve)
            const newPath = `M 150 210 Q ${wobble} ${bend} 250 210`;
            mouthPath.setAttribute('d', newPath);
        }, 80); // Geschwindigkeit der Mundbewegung
    }

    function stopMouthAnimation() {
        clearInterval(speechAnimationInterval);
        // Mund in Ruheposition bringen (leichte, nette Kurve)
        mouthPath.setAttribute('d', "M 150 210 Q 200 220 250 210");
    }

    // --- SPRACHAUSGABE (Text-to-Speech) MIT MUND-SYNC ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Alte Sprache stoppen
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            
            // Wenn Jeff anfängt zu sprechen: Mund-Animation starten
            utterance.onstart = animateMouthSpeaking;
            // Wenn Jeff fertig ist: Mund-Animation stoppen
            utterance.onend = stopMouthAnimation;
            utterance.onerror = stopMouthAnimation; // Sicherheitshalber

            window.speechSynthesis.speak(utterance);
        }
    }

    // --- DYNAMISCHE AUGEN (Pupillen folgen der Maus/dem Finger) ---
    const pupils = [document.getElementById('pupil-left'), document.getElementById('pupil-right')];
    
    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 15; // Max 15px Verschiebung
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        
        pupils.forEach(pupil => {
            pupil.setAttribute('cx', x);
            pupil.setAttribute('cy', 5 + y); // Basis-Y ist 5
        });
    });

    // --- MODUS UMSCHALTEN ---
    function setMode(mode) {
        const body = document.body;
        const adultBtn = document.getElementById('adultBtn');
        const childBtn = document.getElementById('childBtn');
        const statusLabel = document.getElementById('statusLabel');

        if (mode === 'child') {
            body.classList.add('child-mode');
            adultBtn.classList.remove('active-mode');
            childBtn.classList.add('active-mode');
            statusLabel.innerText = "Jeff Zustand: Fröhlich (Kindermodus)";
            localStorage.setItem('jeff_mode', 'child');
            speak("Hallo! Ich bin Jeff. Wollen wir was lernen oder spielen? Das wird toll!");
        } else {
            body.classList.remove('child-mode');
            childBtn.classList.remove('active-mode');
            adultBtn.classList.add('active-mode');
            statusLabel.innerText = "Jeff Zustand: Bereit (Erwachsener)";
            localStorage.setItem('jeff_mode', 'adult');
            speak("System bereit. Erwachsenenmodus ist aktiv.");
        }
    }

    // Zustand laden
    if (localStorage.getItem('jeff_mode') === 'child') { setMode('child'); }
</script>

</body>
</html>
