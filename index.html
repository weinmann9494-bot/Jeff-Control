<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --screen-bg: #000000;
            --eye-color: var(--accent-color);
        }

        .child-mode {
            --bg-color: #f0faff;
            --card-bg: #ffffff;
            --text-color: #004d40;
            --accent-color: #ff4081;
            --screen-bg: #0a0a0a;
            --eye-color: #ff4081;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.4s ease;
            -webkit-user-select: none; user-select: none;
        }

        .container { max-width: 480px; width: 100%; }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: background-color 0.4s ease;
        }

        /* --- JEFFS DISPLAY --- */
        .robot-display {
            background-color: var(--screen-bg);
            border: 4px solid #333;
            border-radius: 24px;
            width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
        }

        #jeff-face-svg {
            width: 100%;
            height: 100%;
        }

        .eye-ball { fill: #ffffff; }
        .eye-pupil { fill: var(--eye-color); transition: fill 0.3s ease; }
        .eye-sparkle { fill: #ffffff; opacity: 0.9; }

        /* Smoothes Blinzeln */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.05); }
        }
        .blinking-eyes {
            transform-box: fill-box;
            transform-origin: center;
            animation: blink 4s infinite;
        }

        /* Mund-Anpassung */
        #mouth-path {
            stroke: var(--eye-color);
            stroke-width: 8;
            stroke-linecap: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .status-text { color: #888; font-size: 0.9em; margin-top: 12px; }
        .btn-group { display: flex; gap: 12px; margin-top: 15px; }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            background-color: #333;
            color: #ccc;
            transition: all 0.2s ease;
        }

        .active-mode {
            background-color: var(--accent-color) !important;
            color: white !important;
        }

        .install-btn {
            background-color: #ff9800;
            color: white;
            width: 100%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <button id="installBtn" class="install-btn" style="display:none;">📲 Jeff-App installieren</button>

    <!-- Simuliertes Anime-Display -->
    <div class="card">
        <div class="robot-display">
            <svg id="jeff-face-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                
                <!-- Augen Gruppe mit Blinzel-Animation -->
                <g class="blinking-eyes">
                    <!-- Linkes Auge -->
                    <g id="eye-left-group">
                        <ellipse class="eye-ball" cx="130" cy="110" rx="35" ry="48"/>
                        <ellipse class="eye-pupil" id="pupil-left" cx="130" cy="115" rx="20" ry="28"/>
                        <circle class="eye-sparkle" cx="118" cy="95" r="8"/>
                        <circle class="eye-sparkle" cx="140" cy="128" r="4"/>
                    </g>

                    <!-- Rechtes Auge -->
                    <g id="eye-right-group">
                        <ellipse class="eye-ball" cx="270" cy="110" rx="35" ry="48"/>
                        <ellipse class="eye-pupil" id="pupil-right" cx="270" cy="115" rx="20" ry="28"/>
                        <circle class="eye-sparkle" cx="258" cy="95" r="8"/>
                        <circle class="eye-sparkle" cx="280" cy="128" r="4"/>
                    </g>
                </g>

                <!-- Animierter Mund -->
                <path id="mouth-path" d="M 150 210 Q 200 230 250 210" />

            </svg>
        </div>
        <div class="status-text" id="statusLabel">Jeff Zustand: Bereit</div>
    </div>

    <!-- Steuerung -->
    <div class="card">
        <h3>Betriebsmodus</h3>
        <div class="btn-group">
            <button id="adultBtn" class="active-mode" onclick="setMode('adult')">👨 Erwachsener</button>
            <button id="childBtn" onclick="setMode('child')">🎈 Kindermodus</button>
        </div>
    </div>
</div>

<script>
    // --- Service Worker ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
    installBtn.addEventListener('click', () => { installBtn.style.display = 'none'; if (deferredPrompt) { deferredPrompt.prompt(); } });

    // --- MUND ANIMATION (Sprechen) ---
    const mouthPath = document.getElementById('mouth-path');
    let speechAnimationInterval;

    function animateMouthSpeaking() {
        if (speechAnimationInterval) clearInterval(speechAnimationInterval);
        speechAnimationInterval = setInterval(() => {
            const bend = 220 + (Math.random() * 30 - 15);
            const wobble = 200 + (Math.random() * 20 - 10);
            mouthPath.setAttribute('d', `M 150 210 Q ${wobble} ${bend} 250 210`);
        }, 70);
    }

    function stopMouthAnimation() {
        clearInterval(speechAnimationInterval);
        mouthPath.setAttribute('d', "M 150 210 Q 200 230 250 210");
    }

    // --- SPRACHAUSGABE ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.onstart = animateMouthSpeaking;
            utterance.onend = stopMouthAnimation;
            utterance.onerror = stopMouthAnimation;
            window.speechSynthesis.speak(utterance);
        }
    }

    // --- PUPILLEN FOLGEN DER MAUS ---
    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');

    window.addEventListener('mousemove', (e) => {
        const offsetX = (e.clientX / window.innerWidth - 0.5) * 16;
        const offsetY = (e.clientY / window.innerHeight - 0.5) * 12;
        
        pupilLeft.setAttribute('cx', 130 + offsetX);
        pupilLeft.setAttribute('cy', 115 + offsetY);
        pupilRight.setAttribute('cx', 270 + offsetX);
        pupilRight.setAttribute('cy', 115 + offsetY);
    });

    // --- MODUS UMSCHALTEN ---
    function setMode(mode) {
        const body = document.body;
        const adultBtn = document.getElementById('adultBtn');
        const childBtn = document.getElementById('childBtn');
        const statusLabel = document.getElementById('statusLabel');

        if (mode === 'child') {
            body.classList.add('child-mode');
            adultBtn.classList.remove('active-mode');
            childBtn.classList.add('active-mode');
            statusLabel.innerText = "Jeff Zustand: Fröhlich (Kindermodus)";
            localStorage.setItem('jeff_mode', 'child');
            speak("Hallo! Ich bin Jeff. Wollen wir was lernen oder spielen?");
        } else {
            body.classList.remove('child-mode');
            childBtn.classList.remove('active-mode');
            adultBtn.classList.add('active-mode');
            statusLabel.innerText = "Jeff Zustand: Bereit (Erwachsener)";
            localStorage.setItem('jeff_mode', 'adult');
            speak("System bereit. Erwachsenenmodus ist aktiv.");
        }
    }

    if (localStorage.getItem('jeff_mode') === 'child') { setMode('child'); }
</script>

</body>
</html>
