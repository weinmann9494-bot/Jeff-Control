<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Control</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b20;
            --text-color: #e0e6ed;
            --accent-color: #00ffaa;
            --screen-bg: #050608;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 440px; width: 100%; }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* OLED Display Simulation (128x64 skaliert) */
        .robot-display {
            background-color: var(--screen-bg);
            border: 3px solid #2a2e37;
            border-radius: 18px;
            width: 100%;
            aspect-ratio: 2 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 255, 170, 0.05);
        }

        #jeff-face-svg { width: 90%; height: 75%; }

        .eye-shape {
            fill: var(--accent-color);
            filter: drop-shadow(0px 0px 6px var(--accent-color));
            transition: all 0.2s ease;
        }

        .screen-text {
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-color);
            width: 100%;
            text-align: left;
            padding-left: 15px;
            margin-top: -5px;
            opacity: 0.8;
        }

        .status-text { color: #8a94a6; font-size: 0.9em; margin-top: 12px; }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--accent-color);
            color: #050608;
            margin-top: 10px;
        }

        .hardware-box { display: flex; gap: 10px; margin-top: 12px; }
        .hardware-box input {
            flex: 2; padding: 12px; border-radius: 10px;
            border: 1px solid #2a2e37; background: #0f1115; color: #fff; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Display View -->
    <div class="card">
        <div class="robot-display">
            <svg id="jeff-face-svg" viewBox="0 0 128 48" xmlns="http://www.w3.org/2000/svg">
                <!-- Linkes Auge -->
                <rect id="eye-left" x="24" y="8" width="32" height="32" rx="8" class="eye-shape"/>
                <!-- Rechtes Auge -->
                <rect id="eye-right" x="72" y="8" width="32" height="32" rx="8" class="eye-shape"/>
            </svg>
            <div class="screen-text" id="oledSubText">> Jeff ready...</div>
        </div>
        <div class="status-text" id="statusLabel">Status: Normaler Modus</div>
    </div>

    <!-- Manuelle Test-Buttons für Zustände -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1em;">Zustände testen</h3>
        <button onclick="setVisualMode(0)">Normal</button>
        <button onclick="setVisualMode(1)">Denken (Thinking)</button>
        <button onclick="setVisualMode(2)">Reden (Speaking)</button>
        <button onclick="setVisualMode(3)">Ausführen (Executing)</button>
    </div>

    <!-- Hardware Verbindung -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1em;">ESP32-C3 Verbindung</h3>
        <div class="hardware-box">
            <input type="text" id="espIp" placeholder="z. B. 192.168.1.50">
            <button onclick="connectEsp()">Verbinden</button>
        </div>
        <div class="status-text" id="wsStatus">Offline</div>
    </div>
</div>

<script>
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const oledSubText = document.getElementById('oledSubText');
    const statusLabel = document.getElementById('statusLabel');

    function setVisualMode(mode, offX = 0, offY = 0) {
        if (mode === 0) { // Normal
            eyeLeft.setAttribute('y', 8 + offY); eyeLeft.setAttribute('height', '32'); eyeLeft.setAttribute('rx', '8');
            eyeRight.setAttribute('y', 8 + offY); eyeRight.setAttribute('height', '32'); eyeRight.setAttribute('rx', '8');
            oledSubText.innerText = "> Jeff ready...";
            statusLabel.innerText = "Status: Normaler Modus";
        } else if (mode === 1) { // Denken
            eyeLeft.setAttribute('y', 6 + offY); eyeLeft.setAttribute('height', '28'); eyeLeft.setAttribute('rx', '10');
            eyeRight.setAttribute('y', 6 + offY); eyeRight.setAttribute('height', '28'); eyeRight.setAttribute('rx', '10');
            oledSubText.innerText = "> Thinking...";
            statusLabel.innerText = "Status: Denkt nach...";
        } else if (mode === 2) { // Reden
            eyeLeft.setAttribute('y', 12 + offY); eyeLeft.setAttribute('height', '20'); eyeLeft.setAttribute('rx', '6');
            eyeRight.setAttribute('y', 12 + offY); eyeRight.setAttribute('height', '20'); eyeRight.setAttribute('rx', '6');
            oledSubText.innerText = "> Speaking...";
            statusLabel.innerText = "Status: Spricht...";
        } else if (mode === 3) { // Ausführen
            eyeLeft.setAttribute('y', 18 + offY); eyeLeft.setAttribute('height', '12'); eyeLeft.setAttribute('rx', '2');
            eyeRight.setAttribute('y', 18 + offY); eyeRight.setAttribute('height', '12'); eyeRight.setAttribute('rx', '2');
            oledSubText.innerText = "> Executing task";
            statusLabel.innerText = "Status: Führt Befehl aus...";
        }
    }

    let ws;
    function connectEsp() {
        const ip = document.getElementById('espIp'].value;
        const wsStatus = document.getElementById('wsStatus');
        if(!ip) return;

        ws = new WebSocket(`ws://${ip}/ws`);
        ws.onopen = () => { wsStatus.innerText = "🟢 Verbunden!"; wsStatus.style.color = "#00ffaa"; };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            setVisualMode(data.mode, data.x, data.y);
        };
        ws.onerror = () => { wsStatus.innerText = "🔴 Fehler"; wsStatus.style.color = "#ff4081"; };
    }
</script>

</body>
</html>
