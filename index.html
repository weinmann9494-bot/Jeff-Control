<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1115">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b20;
            --text-color: #e0e6ed;
            --accent-color: #00ffaa;
            --screen-bg: #050608;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .container { max-width: 440px; width: 100%; }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* Display Simulation (128x64 Auflösung) */
        .robot-display {
            background-color: var(--screen-bg);
            border: 3px solid #2a2e37;
            border-radius: 18px;
            width: 100%;
            aspect-ratio: 2 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 255, 170, 0.05);
        }

        #jeff-face-svg { width: 90%; height: 70%; }

        .eye-shape {
            fill: var(--accent-color);
            filter: drop-shadow(0px 0px 6px var(--accent-color));
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen-text {
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-color);
            width: 100%;
            text-align: left;
            padding-left: 15px;
            padding-right: 15px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: -2px;
            opacity: 0.9;
        }

        .status-text { color: #8a94a6; font-size: 0.9em; margin-top: 12px; }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            background-color: var(--accent-color);
            color: #050608;
            transition: transform 0.1s ease;
        }

        button:active { transform: scale(0.96); }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .input-box input {
            flex: 3;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2a2e37;
            background: #0f1115;
            color: #fff;
            font-size: 0.9em;
        }

        .input-box button { flex: 1; }

        .hardware-box { display: flex; gap: 10px; margin-top: 12px; }
        .hardware-box input {
            flex: 2; padding: 12px; border-radius: 10px;
            border: 1px solid #2a2e37; background: #0f1115; color: #fff; text-align: center;
        }
        .hardware-box button { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <button id="installBtn" style="display:none; width: 100%; margin-bottom: 20px;">📲 Jeff-App installieren</button>

    <!-- Jeff OLED Display -->
    <div class="card">
        <div class="robot-display">
            <svg id="jeff-face-svg" viewBox="0 0 128 48" xmlns="http://www.w3.org/2000/svg">
                <!-- Linkes Auge -->
                <rect id="eye-left" x="24" y="6" width="32" height="34" rx="8" class="eye-shape"/>
                <!-- Rechtes Auge -->
                <rect id="eye-right" x="72" y="6" width="32" height="34" rx="8" class="eye-shape"/>
            </svg>
            <div class="screen-text" id="oledSubText">> Jeff ready...</div>
        </div>
        <div class="status-text" id="statusLabel">Status: Normal (Bereit)</div>
    </div>

    <!-- Chat / Text-Eingabe -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1em;">Mit Jeff sprechen</h3>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Schreibe an Jeff..." onkeydown="if(event.key === 'KeyA' || event.key === 'Enter') sendToJeff()">
            <button onclick="sendToJeff()">Senden</button>
        </div>
    </div>

    <!-- Test-Bedienfeld für Zustände -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1em;">Zustände testen</h3>
        <div class="btn-grid">
            <button onclick="setVisualMode(0)">Normal</button>
            <button onclick="setVisualMode(1)" class="btn-outline">Denken</button>
            <button onclick="setVisualMode(2)" class="btn-outline">Reden</button>
            <button onclick="setVisualMode(3)" class="btn-outline">Ausführen</button>
        </div>
    </div>

    <!-- ESP32 Hardware-Anbindung -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1em;">ESP32-C3 Verbindung</h3>
        <div class="hardware-box">
            <input type="text" id="espIp" placeholder="z. B. 192.168.1.50">
            <button onclick="connectEsp()">Verbinden</button>
        </div>
        <div class="status-text" id="wsStatus">Offline (Simulationsmodus)</div>
    </div>
</div>

<script>
    // --- Service Worker Register ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { 
        e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; 
    });
    installBtn.addEventListener('click', () => { 
        installBtn.style.display = 'none'; if (deferredPrompt) { deferredPrompt.prompt(); } 
    });

    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const oledSubText = document.getElementById('oledSubText');
    const statusLabel = document.getElementById('statusLabel');

    let animInterval = null;

    function stopAnim() {
        if (animInterval) { clearInterval(animInterval); animInterval = null; }
    }

    // --- VISUELLE ZUSTÄNDE STEUERN ---
    function setVisualMode(mode, customText = null) {
        if (mode === 0) { 
            // Normal
            stopAnim();
            eyeLeft.setAttribute('x', 24); eyeLeft.setAttribute('y', 6);
            eyeLeft.setAttribute('width', '32'); eyeLeft.setAttribute('height', '34'); eyeLeft.setAttribute('rx', '8');
            
            eyeRight.setAttribute('x', 72); eyeRight.setAttribute('y', 6);
            eyeRight.setAttribute('width', '32'); eyeRight.setAttribute('height', '34'); eyeRight.setAttribute('rx', '8');
            
            oledSubText.innerText = customText || "> Jeff ready...";
            statusLabel.innerText = "Status: Normal (Bereit)";
        } 
        else if (mode === 1) { 
            // Denken
            stopAnim();
            let step = 0;
            oledSubText.innerText = customText || "> Thinking...";
            statusLabel.innerText = "Status: Denkt nach...";
            animInterval = setInterval(() => {
                let shift = (step % 2 === 0) ? -4 : 4;
                eyeLeft.setAttribute('x', 24 + shift); eyeLeft.setAttribute('y', 4);
                eyeLeft.setAttribute('width', '32'); eyeLeft.setAttribute('height', '28'); eyeLeft.setAttribute('rx', '10');
                
                eyeRight.setAttribute('x', 72 + shift); eyeRight.setAttribute('y', 4);
                eyeRight.setAttribute('width', '32'); eyeRight.setAttribute('height', '28'); eyeRight.setAttribute('rx', '10');
                step++;
            }, 400);
        } 
        else if (mode === 2) { 
            // Reden
            stopAnim();
            let toggle = false;
            oledSubText.innerText = customText || "> Speaking...";
            statusLabel.innerText = "Status: Spricht...";
            animInterval = setInterval(() => {
                let h = toggle ? '20' : '26';
                let y = toggle ? '13' : '10';
                eyeLeft.setAttribute('x', '24'); eyeLeft.setAttribute('y', y);
                eyeLeft.setAttribute('width', '32'); eyeLeft.setAttribute('height', h); eyeLeft.setAttribute('rx', '6');
                
                eyeRight.setAttribute('x', '72'); eyeRight.setAttribute('y', y);
                eyeRight.setAttribute('width', '32'); eyeRight.setAttribute('height', h); eyeRight.setAttribute('rx', '6');
                toggle = !toggle;
            }, 200);
        } 
        else if (mode === 3) { 
            // Ausführen
            stopAnim();
            eyeLeft.setAttribute('x', '24'); eyeLeft.setAttribute('y', '18');
            eyeLeft.setAttribute('width', '32'); eyeLeft.setAttribute('height', '10'); eyeLeft.setAttribute('rx', '2');
            
            eyeRight.setAttribute('x', '72'); eyeRight.setAttribute('y', '18');
            eyeRight.setAttribute('width', '32'); eyeRight.setAttribute('height', '10'); eyeRight.setAttribute('rx', '2');
            
            oledSubText.innerText = customText || "> Executing task";
            statusLabel.innerText = "Status: Führt Befehl aus...";
        }
    }

    // --- INTERAKTION: TEXT EINGEBEN & ANTWORTEN LASSEN ---
    function sendToJeff() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        
        // 1. Phase: Denken
        setVisualMode(1, "> Thinking...");

        setTimeout(() => {
            // Generiere eine einfache Antwort (oder baue hier später deine KI-Logik ein)
            let reply = "Verstanden! Ich kümmere mich darum.";
            if (text.toLowerCase().includes("hallo") || text.toLowerCase().includes("hi")) {
                reply = "Hallo! Wie kann ich dir helfen?";
            } else if (text.toLowerCase().includes("status")) {
                reply = "Alle Systeme laufen optimal.";
            } else {
                reply = "Du hast gesagt: " + text;
            }

            // 2. Phase: Sprechen mit Captions und Sprachausgabe
            setVisualMode(2, "> " + reply);
            speakText(reply);

        }, 1200); // 1.2 Sekunden Denkpause
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            
            utterance.onend = () => {
                // Zurück in den Normalzustand nach dem Sprechen
                setVisualMode(0);
            };
            
            utterance.onerror = () => {
                setVisualMode(0);
            };

            window.speechSynthesis.speak(utterance);
        } else {
            // Fallback, falls kein SpeechSynthesis im Browser
            setTimeout(() => setVisualMode(0), 3000);
        }
    }

    function testState(mode) {
        setVisualMode(mode);
    }

    // --- WEBSOCKET ESP32 ANBINDUNG ---
    let ws;
    function connectEsp() {
        const ip = document.getElementById('espIp').value;
        const wsStatus = document.getElementById('wsStatus');
        if(!ip) return;

        wsStatus.innerText = "Verbinde mit ESP32...";
        ws = new WebSocket(`ws://${ip}/ws`);

        ws.onopen = () => {
            wsStatus.innerText = "🟢 Mit ESP32-C3 verbunden!";
            wsStatus.style.color = "#00ffaa";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            setVisualMode(data.mode);
        };

        ws.onerror = () => {
            wsStatus.innerText = "🔴 Verbindung fehlgeschlagen";
            wsStatus.style.color = "#ff4081";
        };
    }
</script>

</body>
</html>
